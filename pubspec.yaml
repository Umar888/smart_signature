name: smart_signature
description: >-
  A Flutter signature field that enhances what you draw on-device: removes
  jitter, pen hooks and stray marks, adds pen-like ink and levels the baseline.
version: 0.1.0
repository: https://github.com/Umar888/smart_signature
issue_tracker: https://github.com/Umar888/smart_signature/issues
topics:
  - signature
  - signature-pad
  - drawing
  - handwriting
  - ink

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
